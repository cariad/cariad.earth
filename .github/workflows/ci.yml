name: ci

on:
  pull_request: {}
  push:
    branches:
      - main

permissions: {}

jobs:
  lint:
    env:
      MISE_LOCKED: 1                    # Fail if `.config/mise.lock` is out of date
      MISE_LOCKED_VERIFY_PROVENANCE: 1  # Re-verify attestations even though `.config/mise.lock` records them
      MISE_USE_VERSIONS_HOST: 0         # Ask GitHub, not mise's proxy, for attestations

    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned tools
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          cache: false         # Restored tools aren't verified, so don't cache them
          version: 2026.10.10

      # Don't run `mise run lint`: named steps make it easier to hunt failures.

      - name: Lint files against .editorconfig
        run: mise run lint:editorconfig

      - name: Lint Markdown files
        run: mise run lint:markdown

      - name: Lint TOML files
        run: mise run lint:toml

      - env:
          GH_TOKEN: ${{ github.token }}
        name: Audit GitHub Actions files
        run: mise run lint:workflows

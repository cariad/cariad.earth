name: ci

on:
  pull_request: {}
  push:
    branches:
      - main

concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the website
        uses: cariad/platen-action@aae9a1e31c8f978bb57ef0478bba99c7887d2818 # v0.2.0
        with:
          output: site/public
          platen-version: 0.4.0
          templates: site/templates
          values: site/values.yml

      - name: Upload the artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          include-hidden-files: true # Keep `.well-known`, and let WatershipUp refuse the rest
          name: site
          path: site/public

  dry-run:
    if: github.event_name == 'pull_request'

    needs:
      - build

    permissions:
      pull-requests: write

    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Download the artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site/public

      - name: Dry run the publish
        uses: cariad/watershipup-action@98ffc7ca5360e2b26db77f8cfde67e629aba48ef # v0.1.0
        with:
          directory: site/public
          dry-run: true
          password: ${{ secrets.STORAGE_ZONE_READ_ONLY_PASSWORD }}
          watershipup-version: 0.2.0
          zone: cariad-earth-20261022 # Copy from `infra/site/main.tf`

  lint:
    env:
      MISE_LOCKED: 1

    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false         # Restored tools aren't verified, so don't cache them
          version: 2026.10.10

      - name: Lint files against .editorconfig
        run: mise run lint:editorconfig

      - name: Lint Markdown files
        run: mise run lint:markdown

      - name: Lint TOML files
        run: mise run lint:toml

      - env:
          GH_TOKEN: ${{ github.token }}
        name: Audit GitHub Actions files
        run: mise run lint:workflows

  publish:
    environment:
      name: production
      url: https://cariad.earth

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - build
      - lint

    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Download the artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site/public

      - name: Publish the website
        uses: cariad/watershipup-action@98ffc7ca5360e2b26db77f8cfde67e629aba48ef # v0.1.0
        with:
          directory: site/public
          password: ${{ secrets.STORAGE_ZONE_PASSWORD }}
          watershipup-version: 0.2.0
          zone: cariad-earth-20261022 # Copy from `infra/site/main.tf`

name: ci

on:
  pull_request: {}

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  build:
    uses: $/.github/workflows/build.yml

  dry-run:
    needs:
      - build

    permissions:
      pull-requests: write

    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Download the artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site/public

      - name: Dry run the publish
        uses: cariad/watershipup-action@98ffc7ca5360e2b26db77f8cfde67e629aba48ef # v0.1.0
        with:
          directory: site/public
          dry-run: true
          password: ${{ secrets.STORAGE_ZONE_READ_ONLY_PASSWORD }}
          watershipup-version: 0.2.0
          zone: cariad-earth-20261022 # Copy from `infra/site/main.tf`

  lint:
    env:
      MISE_LOCKED: 1

    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false         # Restored tools aren't verified, so don't cache them
          version: 2026.10.10

      - name: Let Chrome create its sandbox # Ubuntu's AppArmor blocks it by default
        run: sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0

      - name: Check the built site's accessibility
        run: mise run lint:a11y

      - name: Lint files against .editorconfig
        run: mise run lint:editorconfig

      - name: Validate the built HTML
        run: mise run lint:html

      - name: Lint Markdown files
        run: mise run lint:markdown

      - name: Lint TOML files
        run: mise run lint:toml

      - env:
          GH_TOKEN: ${{ github.token }}
        name: Audit GitHub Actions files
        run: mise run lint:workflows

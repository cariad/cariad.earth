name: ci

on:
  pull_request: {}
  push:
    branches:
      - main

permissions: {}

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the website
        uses: cariad/platen-action@eb00ce0dd341c7c75396cc4d67e54e81cf5a34e6 # v0.1.0
        with:
          output: site/public
          platen-version: 0.4.0
          templates: site/templates
          values: site/values.yml

  lint:
    env:
      MISE_LOCKED: 1

    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false         # Restored tools aren't verified, so don't cache them
          version: 2026.10.10

      - name: Lint files against .editorconfig
        run: mise run lint:editorconfig

      - name: Lint Markdown files
        run: mise run lint:markdown

      - name: Lint TOML files
        run: mise run lint:toml

      - env:
          GH_TOKEN: ${{ github.token }}
        name: Audit GitHub Actions files
        run: mise run lint:workflows

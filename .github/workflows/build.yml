name: build

on:
  workflow_call: {}

permissions: {}

jobs:
  build:
    env:
      MISE_LOCKED: 1

    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false         # Restored tools aren't verified, so don't cache them
          version: 2026.10.10

      - name: Let Chrome create its sandbox # Ubuntu's AppArmor blocks it by default
        run: sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build the website and PDF
        run: mise run build

      - name: Upload the artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          include-hidden-files: true # Keep `.well-known`, and let WatershipUp refuse the rest
          name: site
          path: site/public
